
services:
  web:
    build:
      context: ./docker/web
      dockerfile: Dockerfile
    depends_on:
      - db
    volumes:
      - ./:/var/www
    platform: linux/amd64 
    # .env の APIキー等（API_KEY / RAPIDAPI_KEY / HOMES_API_BEARER / GOOGLE_MAPS_API_KEY）をPHPに渡す
    env_file: .env
    ports:
      - ${WEB_PORT}:80



  db:
    image: mysql:8.4
    volumes:
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
    # 80番ポートを割り当て
    ports:
      - ${DB_PORT}:3306
